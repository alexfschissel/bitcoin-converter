    <style>
        * {

        body {

        header {

            transform: translateY(-5px);

                    </div>

                <button class="submit-btn" onclick="goToPayment()" style="margin-top: 20px;">

                </button>
            </div>

            <!-- TAB 3: PAGAMENTO -->
            <div id="pagamento-tab" class="tab-content">
                <div style="background: rgba(76, 175, 80, 0.1); border: 2px solid rgba(76, 175, 80, 0.3); border-radius: 12px; padding: 20px; margin-bottom: 20px;">
                    <strong style="color: var(--success);">✅ Você está prestes a ativar o sistema premium</strong><br>
                    <small style="color: #aaa;">Próxima cobrança em 30 dias</small>
                </div>

                <div class="form-group">
                    <label class="form-label">Dados do Cartão</label>
                    <div id="card-element" class="StripeElement"></div>
                </div>

                <button class="submit-btn" id="payBtn" onclick="processPayment()" style="margin-top: 20px;">
                    Pagar R$ 2,99 com Stripe 💳
                </button>

                <div style="text-align: center; margin-top: 20px; font-size: 12px; color: #888;">

                </div>
            </div>
        </section>
    </main>

    <script>
        // ===== CONFIG =====
        const API_URL = 'https://api.coingecko.com/api/v3';
        const STRIPE_PUBLIC_KEY = 'pk_test_51TGnF5RoTlB1iZhj8XUJzO0CT4u6VSGbzi4ao9OltCl43CK4ja4hssXDDQfGzGlVW15F9XDDlYW2YSui1PsAnFs6005StCmNNL';
        
        const stripe = Stripe(STRIPE_PUBLIC_KEY);
        const elements = stripe.elements();
        const cardElement = elements.create('card');
        cardElement.mount('#card-element');

        let currentPrice = 0;

        // ===== ATUALIZAR PREÇO =====
        async function updatePrice() {
            try {
                const response = await fetch(`${API_URL}/simple/price?ids=bitcoin&vs_currencies=usd,brl&include_market_cap=true&include_24hr_vol=true&include_24hr_change=true`);
                const data = await response.json();
                const btcData = data.bitcoin;

                currentPrice = btcData.usd;

                document.getElementById('priceUSD').textContent = 
                    '$' + currentPrice.toLocaleString('en-US', {minimumFractionDigits: 0});
                document.getElementById('priceBRL').textContent = 
                    'R$' + btcData.brl.toLocaleString('pt-BR', {minimumFractionDigits: 0});
                document.getElementById('currentPriceAlerts').textContent = 
                    currentPrice.toLocaleString('en-US', {minimumFractionDigits: 2});
                document.getElementById('updateTime').textContent = 
                    new Date().toLocaleTimeString('pt-BR');

                convertCurrency();

                if (btcData.usd_market_cap) {
                    document.getElementById('marketCap').textContent = 'US$' + 
                        (btcData.usd_market_cap / 1e9).toFixed(0) + 'B';
                }
                if (btcData.usd_24h_vol) {
                    document.getElementById('volume24h').textContent = 'US$' + 
                        (btcData.usd_24h_vol / 1e9).toFixed(1) + 'B';
                }
                const change = btcData.usd_24h_change;
                const changeEl = document.getElementById('change24h');
                changeEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
                changeEl.style.color = change >= 0 ? '#4CAF50' : '#FF6B35';

            } catch (error) {
                console.error('Erro:', error);
            }
        }

        // ===== CONVERSOR =====
        function convertCurrency() {
            const btcAmount = parseFloat(document.getElementById('btcAmount').value) || 0;
            const currency = document.getElementById('convertCurrency').value;

            if (btcAmount <= 0) {
                document.getElementById('conversionResult').textContent = '—';
                return;
            }

            const result = btcAmount * currentPrice;

            if (currency === 'usd') {
                document.getElementById('conversionResult').textContent = 
                    '$' + result.toLocaleString('en-US', {minimumFractionDigits: 2});
            } else {
                document.getElementById('conversionResult').textContent = 
                    result.toLocaleString('en-US', {minimumFractionDigits: 2}) + ' ' + currency.toUpperCase();
            }
        }

        // ===== TROCAR ABA =====
        function switchTab(tab) {
            document.getElementById('dados-tab').classList.remove('show');
            document.getElementById('alertas-tab').classList.remove('show');
            document.getElementById('pagamento-tab').classList.remove('show');

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (tab === 'dados') {
                document.getElementById('dados-tab').classList.add('show');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else if (tab === 'alertas') {
                document.getElementById('alertas-tab').classList.add('show');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            } else if (tab === 'pagamento') {
                document.getElementById('pagamento-tab').classList.add('show');
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
            }
        }

        function goToAlertas() {
            const whatsapp = document.getElementById('whatsappNumber').value;
            const email = document.getElementById('userEmail').value;

            if (!whatsapp || !email) {
                showMessage('Preencha todos os campos', 'error');
                return;
            }

            switchTab('alertas');
        }

        function goToPayment() {
            const above = parseFloat(document.getElementById('alertAbove').value);
            const below = parseFloat(document.getElementById('alertBelow').value);

            if (!above || !below) {
                showMessage('Preencha os dois alertas', 'error');
                return;
            }

            if (above <= currentPrice || below >= currentPrice) {
                showMessage('❌ Alert acima deve ser maior e abaixo deve ser menor que preço atual', 'error');
                return;
            }

            switchTab('pagamento');
        }

        async function processPayment() {
            const whatsapp = document.getElementById('whatsappNumber').value;
            const email = document.getElementById('userEmail').value;
            const above = parseFloat(document.getElementById('alertAbove').value);
            const below = parseFloat(document.getElementById('alertBelow').value);

            const payBtn = document.getElementById('payBtn');
            payBtn.disabled = true;

            try {
                const response = await fetch('/api/create-payment-intent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: 299,
                        email,
                        whatsapp,
                        alertAbove: above,
                        alertBelow: below
                    })
                });

                const data = await response.json();
                const { paymentIntent, error } = await stripe.confirmCardPayment(data.clientSecret, {
                    payment_method: {
                        card: cardElement,
                        billing_details: { email }
                    }
                });

                if (error) {
                    showMessage(`Erro: ${error.message}`, 'error');
                } else if (paymentIntent.status === 'succeeded') {
                    localStorage.setItem('userWhatsapp', whatsapp);
                    localStorage.setItem('userEmail', email);
                    showMessage('✅ Pagamento confirmado! Você será redirecionado...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard-alertas-inteligente.html';
                    }, 2000);
                }
            } catch (error) {
                showMessage(`Erro: ${error.message}`, 'error');
            } finally {
                payBtn.disabled = false;
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message show ${type}`;

            setTimeout(() => {
                msg.classList.remove('show');
            }, 5000);
        }

        // ===== INICIALIZAR =====
        updatePrice();
        setInterval(updatePrice, 30000);
        document.getElementById('btcAmount').addEventListener('input', convertCurrency);
        document.getElementById('convertCurrency').addEventListener('change', convertCurrency);
    </script>
</body>
