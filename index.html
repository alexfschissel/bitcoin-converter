<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Agora</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: Poppins; background: #0a0e27; color: #fff; margin: 0; }
        header { background: #1a1f3a; padding: 20px; text-align: center; border-bottom: 3px solid #F7931A; }
        .logo { font-size: 28px; color: #F7931A; margin: 0; }
        .lang { margin-top: 15px; }
        .lang button { padding: 8px 15px; margin: 0 5px; background: #333; border: 2px solid #F7931A; color: #aaa; border-radius: 6px; cursor: pointer; }
        .lang button.active { background: #F7931A; color: #000; }
        main { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .price { background: #1a1f3a; padding: 40px; text-align: center; margin: 30px 0; border-radius: 12px; border: 2px solid #F7931A; }
        .price h1 { font-size: 48px; color: #F7931A; margin: 10px 0; }
        .partners { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 40px 0; }
        .card { background: #1a1f3a; padding: 25px; border-radius: 12px; border: 2px solid #F7931A; text-align: center; }
        .card h3 { color: #F7931A; margin: 15px 0; font-size: 18px; }
        .card p { color: #aaa; font-size: 13px; margin: 10px 0; }
        .card a { display: inline-block; padding: 10px 20px; background: #F7931A; color: #000; text-decoration: none; border-radius: 6px; font-weight: 700; margin-top: 10px; }
        .card a:hover { background: #FFB81C; }
    </style>
</head>
<body>
    <header>
        <h1 class="logo">Bitcoin Agora</h1>
        <div class="lang">
            <button class="active" onclick="setLang('pt')">PT-BR</button>
            <button onclick="setLang('en')">ENGLISH</button>
            <button onclick="setLang('es')">SPANISH</button>
        </div>
    </header>

    <main>
        <section class="price">
            <h2 id="t-price">Preco Bitcoin</h2>
            <h1 id="price-usd">$0</h1>
            <h1 id="price-brl">R$0</h1>
        </section>

        <section>
            <h2 style="text-align: center; color: #F7931A; margin: 30px 0;" id="t-partners">Parceiras</h2>
            <div class="partners">
                <div class="card">
                    <h3 id="kast-title">Melhor Cartao</h3>
                    <p id="kast-desc">Carteira segura</p>
                    <a href="https://go.kast.xyz/VqVO/N137G56K" target="_blank">Acessar</a>
                </div>
                <div class="card">
                    <h3>Bybit</h3>
                    <p id="bybit-desc">Exchange Trading</p>
                    <a href="https://www.bybit.com/invite?ref=RKKGRO" target="_blank">Acessar</a>
                </div>
                <div class="card">
                    <h3>Ledger</h3>
                    <p id="ledger-desc">Hardware Wallet</p>
                    <a href="https://shop.ledger.com/pt/pages/referral-program?referral_code=KX6C02RWJNBKE" target="_blank">Acessar</a>
                </div>
                <div class="card">
                    <h3>Binance</h3>
                    <p id="binance-desc">Maior Exchange</p>
                    <a href="https://www.binance.com/referral/earn-together/refer2earn-usdc/claim?hl=pt&ref=GRO_28502_8H8KI" target="_blank">Acessar</a>
                </div>
                <div class="card">
                    <h3 id="ebook-title">E-book</h3>
                    <p id="ebook-desc">Aprenda Bitcoin</p>
                    <a href="https://pay.hotmart.com/Q91970052P" target="_blank">Acessar</a>
                </div>
            </div>
        </section>
    </main>

    <script>
        const trans = {
            pt: { 't-price': 'Preco Bitcoin', 't-partners': 'Parceiras', 'kast-title': 'Melhor Cartao de Criptomoedas', 'kast-desc': 'Carteira segura para suas criptomoedas', 'bybit-desc': 'Exchange de trading de criptomoedas', 'ledger-desc': 'Hardware wallet para seguranca maxima', 'binance-desc': 'Maior exchange de criptomoedas do mundo', 'ebook-title': 'E-book', 'ebook-desc': 'Aprenda mais sobre Bitcoin' },
            en: { 't-price': 'Bitcoin Price', 't-partners': 'Our Partners', 'kast-title': 'Best Crypto Card', 'kast-desc': 'Secure wallet for your cryptocurrencies', 'bybit-desc': 'Cryptocurrency trading exchange', 'ledger-desc': 'Hardware wallet for maximum security', 'binance-desc': 'Worlds largest cryptocurrency exchange', 'ebook-title': 'E-book', 'ebook-desc': 'Learn more about Bitcoin' },
            es: { 't-price': 'Precio Bitcoin', 't-partners': 'Socios', 'kast-title': 'Mejor Tarjeta Cripto', 'kast-desc': 'Billetera segura para tus criptomonedas', 'bybit-desc': 'Exchange de trading de criptomonedas', 'ledger-desc': 'Billetera fisica para seguridad maxima', 'binance-desc': 'Mayor exchange de criptomonedas del mundo', 'ebook-title': 'E-book', 'ebook-desc': 'Aprende mas sobre Bitcoin' }
        };

        function setLang(lang) {
            document.querySelectorAll('.lang button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            Object.entries(trans[lang]).forEach(([id, val]) => {
                const el = document.getElementById(id);
                if (el) el.textContent = val;
            });
        }

        async function updatePrice() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,brl');
                const data = await res.json();
                document.getElementById('price-usd').textContent = '$' + data.bitcoin.usd.toLocaleString('en-US', { maximumFractionDigits: 0 });
                document.getElementById('price-brl').textContent = 'R$' + data.bitcoin.brl.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
            } catch (e) { console.error(e); }
        }

        updatePrice();
        setInterval(updatePrice, 30000);
    </script>
</body>
</html>
