<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Bitcoin Agora</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Poppins, sans-serif; background: #0a0e27; color: #fff; }
        header { background: #1a1f3a; padding: 20px; text-align: center; border-bottom: 3px solid #F7931A; }
        .logo { font-size: 28px; color: #F7931A; }
        .lang { margin-top: 15px; }
        .lang button { padding: 8px 15px; margin: 0 5px; background: #333; border: 2px solid #F7931A; color: #aaa; border-radius: 6px; cursor: pointer; }
        .lang button.active { background: #F7931A; color: #fff; }
        main { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .price { background: #1a1f3a; padding: 40px; text-align: center; margin: 30px 0; border-radius: 12px; border: 2px solid #F7931A; }
        .price h1 { font-size: 48px; color: #F7931A; margin: 10px 0; }
        .partners { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 40px 0; }
        .card { background: #1a1f3a; padding: 25px; border-radius: 12px; border: 2px solid #F7931A; text-align: center; }
        .card h3 { color: #F7931A; margin: 15px 0; font-size: 18px; }
        .card p { color: #aaa; font-size: 13px; margin: 10px 0; }
        .card a { display: inline-block; padding: 10px 20px; background: #F7931A; color: #000; text-decoration: none; border-radius: 6px; font-weight: 700; margin-top: 10px; }
        .card a:hover { background: #FFB81C; }
    </style>
</head>
<body>
    <header>
        <div class="logo">₿ Bitcoin Agora</div>
        <div class="lang">
            <button class="active" onclick="setLang('pt')">PT-BR</button>

            <button onclick="setLang('es')">SPANISH</button>
        </div>
    </header>

<script>
    const trans = {
        pt: { 't-price': 'Preço do Bitcoin', 't-partners': 'Nossas Parceiras', 'kast-title': 'Kast', 'kast-desc': 'Melhor Cartão de Criptomoedas', 'bybit-desc': 'Exchange de trading de criptomoedas', 'ledger-desc': 'Hardware wallet para segurança máxima', 'binance-desc': 'Maior exchange de criptomoedas do mundo', 'ebook-title': 'E-book', 'ebook-desc': 'Aprenda mais sobre Bitcoin' },
        en: { 't-price': 'Bitcoin Price', 't-partners': 'Our Partners', 'kast-title': 'Kast', 'kast-desc': 'Best Crypto Card', 'bybit-desc': 'Cryptocurrency trading exchange', 'ledger-desc': 'Hardware wallet for maximum security', 'binance-desc': 'Worlds largest cryptocurrency exchange', 'ebook-title': 'E-book', 'ebook-desc': 'Learn more about Bitcoin' },
        es: { 't-price': 'Precio de Bitcoin', 't-partners': 'Nuestros Socios', 'kast-title': 'Mejor Tarjeta de Criptomonedas', 'kast-desc': 'Billetera segura para tus criptomonedas', 'bybit-desc': 'Exchange de trading de criptomonedas', 'ledger-desc': 'Billetera fisica para maxima seguridad', 'binance-desc': 'Mayor exchange de criptomonedas del mundo', 'ebook-title': 'E-book', 'ebook-desc': 'Aprende mas sobre Bitcoin' }
    };

    function setLang(lang) {
        document.querySelectorAll('.lang button').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        Object.entries(trans[lang]).forEach(([id, text]) => {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        });
    }

    async function updatePrice() {
        try {
            const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,brl');
            const data = await res.json();
            document.getElementById('price-usd').textContent = '$' + data.bitcoin.usd.toLocaleString('en-US', { maximumFractionDigits: 0 });
            document.getElementById('price-brl').textContent = 'R$' + data.bitcoin.brl.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
        } catch (e) { console.error(e); }
    }

    updatePrice();
    setInterval(updatePrice, 30000);
</script>
