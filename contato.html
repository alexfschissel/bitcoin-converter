<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre em Contato | Bitcoin Agora</title>
    <meta name="description" content="Entre em contato com a equipe do Bitcoin Agora. Tire suas dúvidas sobre Bitcoin, conversor e e-book.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://bitcoin-converter-ten.vercel.app/contato">
    <meta name="theme-color" content="#f8991a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f1419; color: #e2e8f0; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #0f1419; border-bottom: 1px solid rgba(248,153,26,0.15); padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
        .header-content { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 18px; font-weight: 800; color: #f8991a; text-decoration: none; }
        nav { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
        nav a { color: #94a3b8; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; transition: color 0.2s; }
        nav a:hover { color: #f8991a; }
        .lang-btn { padding: 6px 12px; background: rgba(248,153,26,0.1); border: 1px solid rgba(248,153,26,0.3); color: #94a3b8; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: 600; font-family: 'Inter', sans-serif; }
        .lang-btn.active { background: #f8991a; color: #0f1419; border-color: #f8991a; }
        main { flex: 1; max-width: 700px; margin: 0 auto; padding: 50px 20px 60px; width: 100%; }
        h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 800; color: #f8991a; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; font-size: 15px; margin-bottom: 40px; }
        .card { background: #1a2332; border: 1px solid rgba(248,153,26,0.2); border-radius: 14px; padding: 32px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        @media (max-width: 560px) { .form-row { grid-template-columns: 1fr; } }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        input, textarea { padding: 12px; background: #0f1419; border: 1px solid rgba(248,153,26,0.2); border-radius: 8px; color: #e2e8f0; font-size: 15px; font-family: 'Inter', sans-serif; width: 100%; transition: border-color 0.2s; }
        textarea { min-height: 140px; resize: vertical; }
        input:focus, textarea:focus { outline: none; border-color: #f8991a; background: #1a2332; }
        .btn { padding: 14px 32px; background: linear-gradient(135deg, #f8991a, #fbb040); color: #0f1419; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: 'Inter', sans-serif; transition: transform 0.2s, box-shadow 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(248,153,26,0.3); }
        .msg { display: none; margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; }
        .msg.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; }
        .msg.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
        footer { border-top: 1px solid rgba(248,153,26,0.1); padding: 24px 20px; text-align: center; color: #64748b; font-size: 13px; }
        footer a { color: #f8991a; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
<header>
    <div class="header-content">
        <a href="/" class="logo">₿ Bitcoin Agora</a>
        <nav>
            <a href="/" data-i18n="nav_home">Início</a>
            <a href="/converter-bitcoin-real" data-i18n="nav_brl">BTC → BRL</a>
            <a href="/converter-bitcoin-dolar" data-i18n="nav_usd">BTC → USD</a>
            <a href="/quanto-vale-1-bitcoin" data-i18n="nav_price">Preço</a>
            <div style="display:flex;gap:4px;margin-left:6px">
                <button class="lang-btn active" data-lang="pt" onclick="setLang('pt')">PT</button>
                <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
                <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
            </div>
        </nav>
    </div>
</header>

<main>
    <h1 data-i18n="page_title">Entre em Contato</h1>
    <p class="subtitle" data-i18n="page_sub">Tem dúvidas sobre Bitcoin, o conversor ou o e-book? Fale com a gente.</p>
    <div class="card">
        <div class="form-row">
            <div class="form-group" style="margin-bottom:0">
                <label for="contact_name" data-i18n="label_name">Nome</label>
                <input type="text" id="contact_name" data-placeholder-i18n="ph_name" placeholder="Seu nome completo">
            </div>
            <div class="form-group" style="margin-bottom:0">
                <label for="contact_email" data-i18n="label_email">Email</label>
                <input type="email" id="contact_email" placeholder="seu@email.com">
            </div>
        </div>
        <div class="form-group">
            <label for="contact_subject" data-i18n="label_subject">Assunto</label>
            <input type="text" id="contact_subject" data-placeholder-i18n="ph_subject" placeholder="Qual é sua dúvida?">
        </div>
        <div class="form-group">
            <label for="contact_message" data-i18n="label_message">Mensagem</label>
            <textarea id="contact_message" data-placeholder-i18n="ph_message" placeholder="Descreva sua mensagem..."></textarea>
        </div>
        <button class="btn" id="sendBtn" onclick="sendEmail()" data-i18n="btn_send">Enviar Mensagem</button>
        <div id="successMessage" class="msg success" data-i18n="msg_success">✅ Mensagem enviada com sucesso!</div>
        <div id="errorMessage" class="msg error" data-i18n="msg_error">❌ Erro ao enviar. Tente novamente.</div>
    </div>
</main>

<footer>
    <p data-i18n="footer_copy">© 2026 Bitcoin Agora</p>
    <p style="margin-top:8px">
        <a href="/" data-i18n="nav_home">Início</a>
        <a href="/converter-bitcoin-real" data-i18n="footer_brl">Conversor BRL</a>
        <a href="/converter-bitcoin-dolar" data-i18n="footer_usd">Conversor USD</a>
        <a href="/sobre" data-i18n="footer_about">Sobre & Legal</a>
        <a href="/inovacao" data-i18n="footer_innov">Inovação</a>
    </p>
</footer>

<script>
const i18n = {
    pt: {
        nav_home: 'Início', nav_brl: 'BTC → BRL', nav_usd: 'BTC → USD', nav_price: 'Preço',
        page_title: 'Entre em Contato',
        page_sub: 'Tem dúvidas sobre Bitcoin, o conversor ou o e-book? Fale com a gente.',
        label_name: 'Nome', label_email: 'Email', label_subject: 'Assunto', label_message: 'Mensagem',
        ph_name: 'Seu nome completo', ph_subject: 'Qual é sua dúvida?', ph_message: 'Descreva sua mensagem...',
        btn_send: 'Enviar Mensagem',
        msg_success: '✅ Mensagem enviada com sucesso!',
        msg_error: '❌ Erro ao enviar. Tente novamente.',
        footer_copy: '© 2026 Bitcoin Agora',
        footer_brl: 'Conversor BRL', footer_usd: 'Conversor USD',
        footer_about: 'Sobre & Legal', footer_innov: 'Inovação',
        alert_fill: 'Preencha todos os campos!'
    },
    en: {
        nav_home: 'Home', nav_brl: 'BTC → BRL', nav_usd: 'BTC → USD', nav_price: 'Price',
        page_title: 'Contact Us',
        page_sub: 'Have questions about Bitcoin, the converter, or the e-book? Get in touch.',
        label_name: 'Name', label_email: 'Email', label_subject: 'Subject', label_message: 'Message',
        ph_name: 'Your full name', ph_subject: 'What is your question?', ph_message: 'Describe your message...',
        btn_send: 'Send Message',
        msg_success: '✅ Message sent successfully!',
        msg_error: '❌ Error sending. Please try again.',
        footer_copy: '© 2026 Bitcoin Agora',
        footer_brl: 'BRL Converter', footer_usd: 'USD Converter',
        footer_about: 'About & Legal', footer_innov: 'Innovation',
        alert_fill: 'Please fill in all fields!'
    },
    es: {
        nav_home: 'Inicio', nav_brl: 'BTC → BRL', nav_usd: 'BTC → USD', nav_price: 'Precio',
        page_title: 'Contáctanos',
        page_sub: '¿Tienes preguntas sobre Bitcoin, el convertidor o el e-book? Escríbenos.',
        label_name: 'Nombre', label_email: 'Correo electrónico', label_subject: 'Asunto', label_message: 'Mensaje',
        ph_name: 'Tu nombre completo', ph_subject: '¿Cuál es tu pregunta?', ph_message: 'Describe tu mensaje...',
        btn_send: 'Enviar Mensaje',
        msg_success: '✅ ¡Mensaje enviado con éxito!',
        msg_error: '❌ Error al enviar. Inténtalo de nuevo.',
        footer_copy: '© 2026 Bitcoin Agora',
        footer_brl: 'Conversor BRL', footer_usd: 'Conversor USD',
        footer_about: 'Sobre & Legal', footer_innov: 'Innovación',
        alert_fill: '¡Por favor completa todos los campos!'
    }
};

let currentLang = localStorage.getItem('lang') || 'pt';

function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('lang', lang);
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
    });
    document.querySelectorAll('[data-placeholder-i18n]').forEach(el => {
        const key = el.dataset.placeholderI18n;
        if (i18n[lang][key]) el.placeholder = i18n[lang][key];
    });
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
}

document.addEventListener('DOMContentLoaded', () => setLang(currentLang));

async function sendEmail() {
    const name = document.getElementById('contact_name').value.trim();
    const email = document.getElementById('contact_email').value.trim();
    const subject = document.getElementById('contact_subject').value.trim();
    const message = document.getElementById('contact_message').value.trim();
    const t = i18n[currentLang];
    if (!name || !email || !subject || !message) { alert(t.alert_fill); return; }
    const mailto = `mailto:alexpromptia@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent('De: ' + name + ' <' + email + '>\n\n' + message)}`;
    window.open(mailto);
    document.getElementById('successMessage').style.display = 'block';
    setTimeout(() => { document.getElementById('successMessage').style.display = 'none'; }, 5000);
}
</script>
</body>
</html>
