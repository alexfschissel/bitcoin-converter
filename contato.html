<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre em Contato | Bitcoin Agora</title>
    <meta name="description" content="Entre em contato com a equipe do Bitcoin Agora. Tire suas dúvidas sobre Bitcoin, conversor e e-book.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://bitcoin-converter-ten.vercel.app/contato">
    <meta name="theme-color" content="#f8991a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f1419; color: #e2e8f0; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #0f1419; border-bottom: 1px solid rgba(248,153,26,0.15); padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
        .header-content { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 18px; font-weight: 800; color: #f8991a; text-decoration: none; }
        nav { display: flex; gap: 6px; flex-wrap: wrap; }
        nav a { color: #94a3b8; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; transition: color 0.2s; }
        nav a:hover { color: #f8991a; }
        main { flex: 1; max-width: 700px; margin: 0 auto; padding: 50px 20px 60px; width: 100%; }
        h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 800; color: #f8991a; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; font-size: 15px; margin-bottom: 40px; }
        .card { background: #1a2332; border: 1px solid rgba(248,153,26,0.2); border-radius: 14px; padding: 32px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        @media (max-width: 560px) { .form-row { grid-template-columns: 1fr; } }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        input, textarea { padding: 12px; background: #0f1419; border: 1px solid rgba(248,153,26,0.2); border-radius: 8px; color: #e2e8f0; font-size: 15px; font-family: 'Inter', sans-serif; width: 100%; transition: border-color 0.2s; }
        textarea { min-height: 140px; resize: vertical; }
        input:focus, textarea:focus { outline: none; border-color: #f8991a; background: #1a2332; }
        .btn { padding: 14px 32px; background: linear-gradient(135deg, #f8991a, #fbb040); color: #0f1419; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: 'Inter', sans-serif; transition: transform 0.2s, box-shadow 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(248,153,26,0.3); }
        .msg { display: none; margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; }
        .msg.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; }
        .msg.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
        footer { border-top: 1px solid rgba(248,153,26,0.1); padding: 24px 20px; text-align: center; color: #64748b; font-size: 13px; }
        footer a { color: #f8991a; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
<header>
    <div class="header-content">
        <a href="/" class="logo">₿ Bitcoin Agora</a>
        <nav>
            <a href="/">Início</a>
            <a href="/converter-bitcoin-real">BTC → BRL</a>
            <a href="/converter-bitcoin-dolar">BTC → USD</a>
            <a href="/quanto-vale-1-bitcoin">Preço</a>
        </nav>
    </div>
</header>

<main>
    <h1>Entre em Contato</h1>
    <p class="subtitle">Tem dúvidas sobre Bitcoin, o conversor ou o e-book? Fale com a gente.</p>
    <div class="card">
        <div class="form-row">
            <div class="form-group" style="margin-bottom:0">
                <label for="contact_name">Nome</label>
                <input type="text" id="contact_name" placeholder="Seu nome completo">
            </div>
            <div class="form-group" style="margin-bottom:0">
                <label for="contact_email">Email</label>
                <input type="email" id="contact_email" placeholder="seu@email.com">
            </div>
        </div>
        <div class="form-group">
            <label for="contact_subject">Assunto</label>
            <input type="text" id="contact_subject" placeholder="Qual é sua dúvida?">
        </div>
        <div class="form-group">
            <label for="contact_message">Mensagem</label>
            <textarea id="contact_message" placeholder="Descreva sua mensagem..."></textarea>
        </div>
        <button class="btn" onclick="sendEmail()">Enviar Mensagem</button>
        <div id="successMessage" class="msg success">✅ Mensagem enviada com sucesso!</div>
        <div id="errorMessage" class="msg error">❌ Erro ao enviar. Tente novamente.</div>
    </div>
</main>

<footer>
    <p>© 2026 Bitcoin Agora</p>
    <p style="margin-top:8px">
        <a href="/">Início</a>
        <a href="/converter-bitcoin-real">Conversor BRL</a>
        <a href="/converter-bitcoin-dolar">Conversor USD</a>
        <a href="/sobre">Sobre & Legal</a>
    </p>
</footer>

<script>
async function sendEmail() {
    const name = document.getElementById('contact_name').value.trim();
    const email = document.getElementById('contact_email').value.trim();
    const subject = document.getElementById('contact_subject').value.trim();
    const message = document.getElementById('contact_message').value.trim();
    if (!name || !email || !subject || !message) { alert('Preencha todos os campos!'); return; }
    const mailto = `mailto:alexpromptia@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent('De: ' + name + ' <' + email + '>\n\n' + message)}`;
    window.open(mailto);
    document.getElementById('successMessage').style.display = 'block';
    setTimeout(() => { document.getElementById('successMessage').style.display = 'none'; }, 5000);
}
</script>
</body>
</html>
